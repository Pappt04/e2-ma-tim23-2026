services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: slagalica
      POSTGRES_USER: slagalica
      POSTGRES_PASSWORD: slagalica
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
